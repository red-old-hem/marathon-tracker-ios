name: MarathonTracker
options:
  bundleIdPrefix: com.eiichi
  deploymentTarget:
    iOS: "17.0"
targets:
  MarathonTracker:
    type: application
    platform: iOS
    sources: [MarathonTracker]
    info:
      path: MarathonTracker/Info.plist
      properties:
        CFBundleDisplayName: マラソン18週
        CFBundleDevelopmentRegion: ja
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSHealthShareUsageDescription: ランニングのワークアウトを読み取り、走った日を自動でチェックインするために使用します
    entitlements:
      path: MarathonTracker/MarathonTracker.entitlements
      properties:
        com.apple.developer.healthkit: true
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_LANGUAGE: ja
        # ここに書かないと xcodegen generate のたびに
        # Xcode で選んだ Team が消え、実機ビルドが
        # 「requires a development team」で失敗する
        DEVELOPMENT_TEAM: V677493FKX
        CODE_SIGN_STYLE: Automatic
  MarathonTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MarathonTrackerTests]
    dependencies:
      - target: MarathonTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eiichi.MarathonTrackerTests
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
