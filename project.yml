name: MarathonTracker
options:
  bundleIdPrefix: com.eiichi
  deploymentTarget:
    iOS: "17.0"
targets:
  MarathonTracker:
    type: application
    platform: iOS
    sources: [MarathonTracker]
    info:
      path: MarathonTracker/Info.plist
      properties:
        CFBundleDisplayName: マラソン18週
        CFBundleDevelopmentRegion: ja
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSHealthShareUsageDescription: ランニングのワークアウトを読み取り、走った日を自動でチェックインするために使用します
    entitlements:
      path: MarathonTracker/MarathonTracker.entitlements
      properties:
        com.apple.developer.healthkit: true
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_LANGUAGE: ja
